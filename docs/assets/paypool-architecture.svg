<text x="78" y="739" class="head">Discovery &amp; agent interfaces</text>
<text x="78" y="771" class="body">Catalog search, facets and comparisons</text>
<text x="78" y="798" class="body">Saved conversations and recurring needs</text>
<text x="78" y="825" class="body">Reviewed catalog imports and feed export</text>
<text x="78" y="852" class="body">ACP continuation → buyer approval</text>
<rect x="564" y="702" width="472" height="176" rx="16" fill="#fff" stroke="#d8e1ed"/><rect x="564" y="720" width="4" height="26" rx="2" fill="#166bce"/>
<text x="586" y="739" class="head">Deterministic clearing &amp; recovery</text>
<text x="586" y="771" class="body">Combine compatible demand into a run</text>
<text x="586" y="798" class="body">Validate capacity, cutoffs and freight</text>
<text x="586" y="825" class="body">Freeze allocation and delivery snapshots</text>
<text x="586" y="852" class="body">Dropout → re-clear → renewed consent</text>
<rect x="1072" y="702" width="472" height="176" rx="16" fill="#f0edfc" stroke="#d8e1ed"/><rect x="1072" y="720" width="4" height="26" rx="2" fill="#6353b7"/>
<text x="1094" y="739" class="head">PayPal REST APIs</text>
<text x="1094" y="771" class="body">OAuth 2.0 → Orders → buyer approval</text>
<text x="1094" y="798" class="body">Authorize · capture · void · refund</text>
<text x="1094" y="825" class="body">Signed webhook verification and dedupe</text>
<text x="1094" y="852" class="body">Separate buyer payments to merchant</text>
<polyline points="528,790 564,790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1036,790 1072,790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
