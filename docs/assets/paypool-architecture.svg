<text x="78" y="1187" class="body">Users · catalog · agreements · payments</text>
<text x="78" y="1214" class="body">Immutable snapshots · evidence · audit</text>
<text x="78" y="1241" class="body">PostgreSQL / PostGIS · SQLite local mode</text>
<rect x="564" y="1118" width="472" height="150" rx="16" fill="#fff" stroke="#d8e1ed"/><rect x="564" y="1136" width="4" height="26" rx="2" fill="#0b9c90"/>
<text x="586" y="1155" class="head">Outbox + background workers</text>
<text x="586" y="1187" class="body">Commit domain changes with events</text>
<text x="586" y="1214" class="body">Recurrence · expiry · recovery · projections</text>
<text x="586" y="1241" class="body">SQL worker / Redis + Celery</text>
<rect x="1072" y="1118" width="472" height="150" rx="16" fill="#fff" stroke="#d8e1ed"/><rect x="1072" y="1136" width="4" height="26" rx="2" fill="#6353b7"/>
<text x="1094" y="1155" class="head">Search &amp; operational visibility</text>
<text x="1094" y="1187" class="body">SQL / Elasticsearch discovery indexes</text>
<text x="1094" y="1214" class="body">Notifications · ledger · worker health</text>
<text x="1094" y="1241" class="body">Scoped audit search and admin recovery</text>
<polyline points="528,1192 564,1192" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1036,1192 1072,1192" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="56" y="1300" width="1488" height="106" rx="16" fill="#17243b"/>
<text x="80" y="1335" class="label" style="fill:#65ddd0">AUTHORITY BOUNDARIES</text>
<text x="80" y="1366" class="body" style="fill:#fff">AI proposes → deterministic rules validate → each buyer consents → PayPal authorizes → verified events reconcile.</text>
<text x="80" y="1391" class="small" style="fill:#cad7e7">Secrets stay server-side. Changed terms require fresh approval. Each buyer pays individually; no shared wallet or escrow.</text>
</svg>