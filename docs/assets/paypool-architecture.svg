<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1460" viewBox="0 0 1600 1460" role="img" aria-labelledby="title desc"><title id="title">PayPool full system architecture</title><desc id="desc">Four role portals connect through a secured FastAPI application to bounded AI agents, a deterministic procurement engine and PayPal payments. Fulfillment, a durable event outbox, workers, SQL records and search support the complete purchasing lifecycle.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><rect width="1600" height="1460" rx="28" fill="#f4f7fb"/><style>text{font-family:Inter,Arial,sans-serif;fill:#17243b}.title{font-size:44px;font-weight:750}.sub{font-size:19px;fill:#52647b}.label{font-size:15px;font-weight:700;letter-spacing:2px}.head{font-size:23px;font-weight:700}.body{font-size:18px;fill:#43536b}.small{font-size:16px;fill:#52647b}</style>
<text x="56" y="72" class="title">PayPool</text>
<text x="56" y="106" class="sub">Collective buying power. Individual payment control.</text>
<text text-anchor="end" x="1544" y="68" class="label" style="fill:#166bce">SYSTEM ARCHITECTURE</text>
