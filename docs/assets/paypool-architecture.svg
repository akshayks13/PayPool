<text x="1094" y="551" class="body">Persist operation intent before API calls</text>
<text x="1094" y="578" class="body">Per-buyer checkout and authorization</text>
<text x="1094" y="605" class="body">Idempotency · retries · reconciliation</text>
<text x="1094" y="632" class="body">Stable references for every money action</text>
