<polyline points="1308,878 1308,900" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="56" y="915" class="label">05  FULFILLMENT &amp; FINANCIAL RECORDS</text>
<rect x="56" y="932" width="1488" height="132" rx="16" fill="#fff" stroke="#d8e1ed"/><rect x="56" y="950" width="4" height="26" rx="2" fill="#0b9c90"/>
<text x="78" y="969" class="head">Fulfillment, delivery and reconciliation</text>
<text x="78" y="1001" class="body">Inventory reservation → fleet / route assignment → driver photo evidence → buyer receipt confirmation</text>
<text x="78" y="1028" class="body">Delivery-triggered payment actions · exceptions / redelivery · cancellation recovery · printable receipts · reconciled ledger</text>
<polyline points="800,1064 800,1085" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="56" y="1101" class="label">06  DURABLE DATA &amp; BACKGROUND SERVICES</text>
<rect x="56" y="1118" width="472" height="150" rx="16" fill="#fff" stroke="#d8e1ed"/><rect x="56" y="1136" width="4" height="26" rx="2" fill="#166bce"/>
