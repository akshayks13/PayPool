<text x="78" y="347" class="head">Next.js portal → FastAPI application</text>
<text x="78" y="379" class="body">Session authentication · CSRF protection · role and ownership checks · versioned requests</text>
<text x="78" y="406" class="body">Business profiles · supplier onboarding · authenticated media · notifications · OpenAPI contracts</text>
<polyline points="292,428 292,448" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
