<text x="564" y="463" class="label" style="fill:#166bce">03  PROCUREMENT &amp; CONSENT</text>
<text x="1072" y="463" class="label" style="fill:#6353b7">04  PAYPAL PAYMENTS</text>
<rect x="56" y="482" width="472" height="176" rx="16" fill="#fff" stroke="#d8e1ed"/><rect x="56" y="500" width="4" height="26" rx="2" fill="#0b9c90"/>
<text x="78" y="519" class="head">Buyer &amp; supplier policy agents</text>
<text x="78" y="551" class="body">Interpret needs and supplier quotations</text>
<text x="78" y="578" class="body">Suggest compatible groups and counters</text>
<text x="78" y="605" class="body">Gemini: extraction, retrieval, explanations</text>
<text x="78" y="632" class="body">Bounded proposals → editable buyer inputs</text>
<rect x="564" y="482" width="472" height="176" rx="16" fill="#fff" stroke="#d8e1ed"/><rect x="564" y="500" width="4" height="26" rx="2" fill="#166bce"/>
<text x="586" y="519" class="head">Commercial agreement engine</text>
<text x="586" y="551" class="body">Versioned offers, counters and acceptance</text>
<text x="586" y="578" class="body">SKU rules · minimums · tiers · stock</text>
<text x="586" y="605" class="body">Quantity range · target · hard price ceiling</text>
<text x="586" y="632" class="body">Explicit buyer consent for exact terms</text>
<rect x="1072" y="482" width="472" height="176" rx="16" fill="#fff" stroke="#d8e1ed"/><rect x="1072" y="500" width="4" height="26" rx="2" fill="#6353b7"/>
