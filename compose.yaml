# Local demonstration only. Credentials and seeded accounts are public fixtures.
services:
  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: paypool
      POSTGRES_USER: paypool
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - paypool-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paypool -d paypool"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://paypool:local-demo-only@database:5432/paypool
      PAYPOOL_POSTGIS: "true"
      PAYPOOL_DEMO_MODE: "true"
      PAYPOOL_PAYMENT_PROVIDER: demo
      PAYPOOL_LLM_PROVIDER: deterministic
      PAYPOOL_FRONTEND_URL: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://backend:8000
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  paypool-db:
