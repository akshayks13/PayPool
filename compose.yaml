# Local demonstration only. Credentials and seeded accounts are public fixtures.
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: paypool
      POSTGRES_USER: paypool
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - paypool-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paypool -d paypool"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://paypool:local-demo-only@database:5432/paypool
      PAYPOOL_POSTGIS: "true"
      PAYPOOL_DEMO_MODE: "true"
      PAYPOOL_PAYMENT_PROVIDER: demo
      PAYPOOL_LLM_PROVIDER: deterministic
      PAYPOOL_FRONTEND_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://backend:8000
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "celery", "-A", "app.platform.tasks", "worker", "--beat", "--loglevel=INFO", "--concurrency=2"]
    environment:
      DATABASE_URL: postgresql://paypool:local-demo-only@database:5432/paypool
      PAYPOOL_POSTGIS: "true"
      PAYPOOL_DEMO_MODE: "true"
      PAYPOOL_PAYMENT_PROVIDER: demo
      PAYPOOL_LLM_PROVIDER: deterministic
      REDIS_URL: redis://redis:6379/0
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
volumes:
  paypool-db:
